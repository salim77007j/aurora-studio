[package]
name = "aurora_engine"
version = "3.0.0"
edition = "2021"

[lib]
name = "aurora_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
rayon = "1.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
